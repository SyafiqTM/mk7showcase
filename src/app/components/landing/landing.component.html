<!-- Hero Title Section -->
<section class="hero-title">
  <h1 class="main-title">CAPIK 7.5R</h1>
  <p class="subtitle">Pure Performance Engineering</p>
  
  <!-- Scroll Indicator -->
  <div class="scroll-indicator" (click)="scrollToTop()">
    <span class="scroll-text">Scroll to Explore</span>
    <div class="scroll-arrow"></div>
  </div>
</section>

<!-- Stack Cards Section -->
<section class="stack-section">
  <div class="stack-card tilt1" #stackCard1>
    <h2>Ready to send it.</h2>
    <img src="assets/IMG_8020.jpeg" alt="Golf R ready to send it" />
  </div>
  
  <div class="stack-card tilt2" #stackCard2>
    <h2>Built for the chase.</h2>
    <img src="assets/IMG_3863.jpg" alt="Golf R built for the chase" />
  </div>
  
  <div class="stack-card tilt3" #stackCard3>
    <h2>Mean look, clean build.</h2>
    <img src="assets/IMG_3765.jpg" alt="Golf R clean build" />
  </div>
</section>

<!-- Video Section -->
<section class="video-section">
  <div class="video-container">
    <h2 class="video-title">Experience the Drive</h2>
    <div class="video-wrapper">
      <video 
        #golfVideo 
        preload="metadata" 
        (ended)="onVideoEnded()" 
        (pause)="onVideoPause()">
        <source src="assets/Download.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      
      <!-- Custom Play Button -->
      <div 
        class="play-button-overlay" 
        [class.hidden]="isVideoPlaying"
        (click)="playVideo()">
        <div class="play-button">
          <div class="play-icon"></div>
        </div>
        <p class="play-text">Watch the Journey</p>
      </div>
    </div>
  </div>
</section>
